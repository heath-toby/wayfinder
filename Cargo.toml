[package]
name = "wayfinder"
version = "2.4.0"
edition = "2021"
description = "Accessible GTK4 file manager"
license = "GPL-3.0-or-later"

[[bin]]
name = "wayfinder"
path = "src/main.rs"

[[bin]]
name = "wayfinder-portal"
path = "src/portal/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }
