[package]
name = "wayfinder"
version = "2.6.0"
edition = "2021"
description = "Accessible GTK4 file manager"
license = "GPL-3.0-or-later"

[[bin]]
name = "wayfinder"
path = "src/main.rs"

[[bin]]
name = "wayfinder-portal"
path = "src/portal/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
dirs = "7"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
zbus = { version = "6", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = { version = "0.3", default-features = false }
