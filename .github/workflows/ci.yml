name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: install GTK4 system deps
        # Wayfinder is a GTK4 app; cargo build needs the dev headers.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev \
            pkg-config

      - name: cargo fmt --check
        # Formatting is a hard gate — rustfmt is deterministic and running
        # it locally is one command. Enforcing in CI keeps the diff clean.
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Clippy is a hard gate too (RUSTFLAGS=-D warnings above makes
        # warnings fail). To add an exception for a specific lint, use
        # #[allow(...)] in the code or #![allow(...)] at module scope.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features
