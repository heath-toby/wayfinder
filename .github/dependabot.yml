# Dependabot config — https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # zbus 6 is a sprawling breaking change (zvariant renames, interface
      # macro move, builder API). Pin to 5.x until a deliberate migration.
      - dependency-name: zbus
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - ci
